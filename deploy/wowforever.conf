# Caddy sur Exilium : /etc/caddy/wowforever.conf, importé depuis /etc/caddy/Caddyfile.
wowforever.julien-aubree.space {
	encode zstd gzip

	# Fonds de carte et tuiles : servis directement, cache long.
	handle /cartes/* {
		root * /opt/wow-carto/public
		header Cache-Control "public, max-age=604800"
		file_server
	}

	handle {
		reverse_proxy 127.0.0.1:3030
	}
}
